name: Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/android-apk.yml'
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare offline Android sources
        shell: bash
        run: |
          python3 - <<'PY'
          import json, pathlib, shutil
          files = json.loads(r'''{"android/app/build.gradle":"plugins { id 'com.android.application' }\nandroid {\n    namespace 'com.brkcvnt.kaloripusulasi'\n    compileSdk 35\n    defaultConfig {\n        applicationId 'com.brkcvnt.kaloripusulasi'\n        minSdk 26\n        targetSdk 34\n        versionCode 1\n        versionName '1.0.0'\n    }\n}\ndependencies { implementation 'androidx.webkit:webkit:1.12.1' }\n","android/app/src/main/AndroidManifest.xml":"<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\">\n    <application android:label=\"Kalori Pusulası\" android:icon=\"@mipmap/ic_launcher\" android:theme=\"@android:style/Theme.Material.Light.NoActionBar\" android:allowBackup=\"false\" android:usesCleartextTraffic=\"false\" android:supportsRtl=\"true\">\n        <activity android:name=\".MainActivity\" android:exported=\"true\" android:configChanges=\"orientation|screenSize|keyboardHidden\" android:windowSoftInputMode=\"adjustResize\">\n            <intent-filter><action android:name=\"android.intent.action.MAIN\"/><category android:name=\"android.intent.category.LAUNCHER\"/></intent-filter>\n        </activity>\n    </application>\n</manifest>\n","android/app/src/main/java/com/brkcvnt/kaloripusulasi/MainActivity.java":"package com.brkcvnt.kaloripusulasi;\n\nimport android.app.Activity;\nimport android.app.AlertDialog;\nimport android.content.Intent;\nimport android.graphics.Color;\nimport android.net.Uri;\nimport android.os.Bundle;\nimport android.webkit.*;\nimport android.widget.Toast;\nimport androidx.webkit.WebViewAssetLoader;\nimport java.io.OutputStream;\nimport java.nio.charset.StandardCharsets;\n\n/** Loads only bundled application assets; no Internet or storage permission. */\npublic class MainActivity extends Activity {\n    private WebView web;\n    private ValueCallback<Uri[]> chooser;\n    private String pendingBackup;\n    private static final int IMPORT = 21, EXPORT = 22;\n    private static final String HOST = \"appassets.androidplatform.net\";\n\n    @Override public void onCreate(Bundle saved) {\n        super.onCreate(saved);\n        getWindow().setStatusBarColor(Color.rgb(22,61,53));\n        getWindow().setNavigationBarColor(Color.rgb(22,61,53));\n        web = new WebView(this);\n        web.setBackgroundColor(Color.rgb(246,247,243));\n        setContentView(web);\n        WebSettings settings = web.getSettings();\n        settings.setJavaScriptEnabled(true);\n        settings.setDomStorageEnabled(true);\n        settings.setAllowFileAccess(false);\n        settings.setAllowContentAccess(true); // Read only documents selected through Android's picker.\n        settings.setMixedContentMode(WebSettings.MIXED_CONTENT_NEVER_ALLOW);\n        web.addJavascriptInterface(new BackupBridge(), \"AndroidBackup\");\n        WebViewAssetLoader loader = new WebViewAssetLoader.Builder()\n            .addPathHandler(\"/assets/\", new WebViewAssetLoader.AssetsPathHandler(this)).build();\n        web.setWebViewClient(new WebViewClient() {\n            @Override public WebResourceResponse shouldInterceptRequest(WebView view, WebResourceRequest req) {\n                WebResourceResponse result = loader.shouldInterceptRequest(req.getUrl());\n                if (result != null) return result;\n                return new WebResourceResponse(\"text/plain\", \"UTF-8\", 403, \"Blocked\", null, new java.io.ByteArrayInputStream(new byte[0]));\n            }\n            @Override public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest req) {\n                Uri uri=req.getUrl();\n                if (\"https\".equals(uri.getScheme()) && HOST.equals(uri.getHost()) && uri.getPath().startsWith(\"/assets/\")) return false;\n                if (req.isForMainFrame() && (\"https\".equals(uri.getScheme()) || \"http\".equals(uri.getScheme()))) {\n                    try { startActivity(new Intent(Intent.ACTION_VIEW, uri)); } catch(Exception e) { message(\"Bağlantıyı açacak tarayıcı bulunamadı.\"); }\n                }\n                return true;\n            }\n        });\n        web.setWebChromeClient(new WebChromeClient() {\n            @Override public boolean onShowFileChooser(WebView view, ValueCallback<Uri[]> callback, FileChooserParams params) {\n                if (chooser!=null) chooser.onReceiveValue(null);\n                chooser=callback;\n                Intent pick=new Intent(Intent.ACTION_OPEN_DOCUMENT).addCategory(Intent.CATEGORY_OPENABLE).setType(\"application/json\");\n                try { startActivityForResult(pick,IMPORT); } catch(Exception e) { chooser.onReceiveValue(null); chooser=null; message(\"Dosya seçici açılamadı.\"); }\n                return true;\n            }\n            @Override public boolean onJsConfirm(WebView view, String url, String text, JsResult result) {\n                new AlertDialog.Builder(MainActivity.this).setTitle(\"Kalori Pusulası\").setMessage(text)\n                    .setPositiveButton(\"Devam et\",(d,w)->result.confirm()).setNegativeButton(\"Vazgeç\",(d,w)->result.cancel())\n                    .setOnCancelListener(d->result.cancel()).show();\n                return true;\n            }\n        });\n        web.loadUrl(\"https://\"+HOST+\"/assets/index.html\");\n    }\n\n    private void message(String text) { Toast.makeText(this,text,Toast.LENGTH_LONG).show(); }\n    public class BackupBridge {\n        @JavascriptInterface public void exportJson(String json) {\n            if (json==null || json.length()>5_000_000) return;\n            runOnUiThread(()->{\n                pendingBackup=json;\n                Intent save=new Intent(Intent.ACTION_CREATE_DOCUMENT).addCategory(Intent.CATEGORY_OPENABLE)\n                    .setType(\"application/json\").putExtra(Intent.EXTRA_TITLE,\"kalori-pusulasi-yedek.json\");\n                try { startActivityForResult(save,EXPORT); } catch(Exception e) { pendingBackup=null; message(\"Yedek kaydedilemedi.\"); }\n            });\n        }\n    }\n    @Override protected void onActivityResult(int request,int result,Intent data) {\n        super.onActivityResult(request,result,data);\n        if(request==IMPORT && chooser!=null) {\n            chooser.onReceiveValue(result==RESULT_OK && data!=null && data.getData()!=null ? new Uri[]{data.getData()} : null);\n            chooser=null;\n        }\n        if(request==EXPORT) {\n            String json=pendingBackup; pendingBackup=null;\n            if(result==RESULT_OK && data!=null && data.getData()!=null && json!=null) {\n                try(OutputStream out=getContentResolver().openOutputStream(data.getData())) {\n                    if(out==null) throw new java.io.IOException();\n                    out.write(json.getBytes(StandardCharsets.UTF_8));\n                    message(\"Yedek kaydedildi.\");\n                } catch(Exception e) { message(\"Yedek kaydedilemedi.\"); }\n            }\n        }\n    }\n    @Override public void onBackPressed() { if(web.canGoBack()) web.goBack(); else super.onBackPressed(); }\n    @Override protected void onDestroy() { if(chooser!=null) chooser.onReceiveValue(null); web.removeJavascriptInterface(\"AndroidBackup\"); web.destroy(); super.onDestroy(); }\n}\n","android/build.gradle":"plugins { id 'com.android.application' version '8.7.3' apply false }\n","android/gradle.properties":"android.useAndroidX=true\norg.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8\n","android/README.md":"# Kalori Pusulası Android\n\nAndroid 8.0+ için internetsiz çalışan WebView uygulaması. Web dosyaları APK içine gömülür. İnternet, kamera, konum ve genel depolama izni istemez. Yedekleme için Android'in dosya seçicisi kullanılır. APK verileri tarayıcı verilerinden ayrıdır.\n\nGitHub Actions içindeki Android APK akışı, Gradle 8.9 / JDK 17 / AGP 8.7.3 ile bu projeyi hazırlar ve `assembleDebug` çalıştırır. Kalori testleri ve APK imza doğrulaması yapılır. Kişisel kullanım için debug imzalıdır; Play Store üretim sürümü değildir. Derlemeler arası imza anahtarı korunmaz; yeniden kurulum gerekebilir. Uygulamayı kaldırmadan önce JSON yedeği al.\n\nGerçek cihaz kurulumu bu geliştirme ortamında test edilememiştir. Web arayüzü tarayıcıda test edilmiştir.\n\nYayın: https://github.com/Brkcvnt/kalori-pusulasi/releases/tag/android-v1.0.0\n","android/settings.gradle":"pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }\ndependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }\nrootProject.name = 'KaloriPusulasi'\ninclude ':app'\n"}''')
          for filename, content in files.items():
              dest=pathlib.Path(filename); dest.parent.mkdir(parents=True, exist_ok=True); dest.write_text(content, encoding="utf-8")
          assets=pathlib.Path("android/app/src/main/assets"); assets.mkdir(parents=True,exist_ok=True)
          for filename in ["index.html","style.css","app.js","core.js","icon.svg","icon-192.png","icon-512.png","manifest.webmanifest"]:
              shutil.copyfile(filename,assets / filename)
          app=(assets / "app.js").read_text(encoding="utf-8")
          old="$('#export').onclick=()=>{"
          new="$('#export').onclick=()=>{if(window.AndroidBackup){window.AndroidBackup.exportJson(JSON.stringify(state,null,2));return;}"
          assert app.count(old)==1, "Export integration changed"
          app=app.replace(old,new)
          app=app.replace("if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});", "// Bundled Android assets work offline without a service worker.")
          (assets / "app.js").write_text(app,encoding="utf-8")
          icons=pathlib.Path("android/app/src/main/res/mipmap-xxxhdpi"); icons.mkdir(parents=True,exist_ok=True)
          shutil.copyfile("icon-512.png",icons / "ic_launcher.png")
          PY
      - name: Build installable APK
        run: gradle -p android assembleDebug --no-daemon
      - name: Verify APK and package sources
        shell: bash
        run: |
          mkdir -p apk-output
          cp android/app/build/outputs/apk/debug/app-debug.apk apk-output/Kalori-Pusulasi-1.0.0.apk
          BT=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$BT/apksigner" verify --verbose apk-output/Kalori-Pusulasi-1.0.0.apk
          "$BT/aapt" dump badging apk-output/Kalori-Pusulasi-1.0.0.apk > apk-output/APK-INFO.txt
          head -25 apk-output/APK-INFO.txt
          (cd apk-output && sha256sum Kalori-Pusulasi-1.0.0.apk > SHA256SUMS.txt)
          zip -r apk-output/Android-Kaynak-Kodu.zip android -x 'android/.gradle/*' 'android/app/build/*' 'android/build/*'
      - uses: actions/upload-artifact@v4
        with:
          name: Kalori-Pusulasi-Android
          path: apk-output/
      - name: Publish Android download
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          cat > apk-output/NOTES.md <<'NOTES'
          Kalori Pusulası Android 1.0.0 — Android 8.0 ve üstü.

          APK ilk açılıştan itibaren çevrimdışı çalışır. İnternet, kamera, konum veya genel depolama izni istemez. Profil ve besin kayıtları uygulamada saklanır. Web sürümünden aktarım için JSON yedeği kullanılabilir.

          Kişisel kullanım için debug imzalı kurulum paketidir; Play Store üretim sürümü değildir. Sonraki derlemelerde imza anahtarı değişebilir; güncelleme öncesinde yedek alın. Gerçek Android cihazında kurulum testi bu ortamda yapılmadı. Derlemede kalori testleri ve APK imza doğrulaması çalıştırılır.
          NOTES
          if gh release view android-v1.0.0 >/dev/null 2>&1; then
            gh release upload android-v1.0.0 apk-output/*.apk apk-output/*.zip apk-output/SHA256SUMS.txt --clobber
          else
            gh release create android-v1.0.0 apk-output/*.apk apk-output/*.zip apk-output/SHA256SUMS.txt --target "$GITHUB_SHA" --title 'Kalori Pusulası Android 1.0.0' --notes-file apk-output/NOTES.md
          fi
