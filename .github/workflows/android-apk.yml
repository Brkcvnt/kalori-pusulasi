name: Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/android-apk.yml'
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare offline app and native updater
        shell: bash
        run: |
          python3 - <<'PY'
          import json, pathlib, shutil
          files=json.loads(r'''{"android/app/build.gradle":"plugins { id 'com.android.application' }\nandroid {\n    namespace 'com.brkcvnt.kaloripusulasi'\n    compileSdk 35\n    defaultConfig {\n        applicationId 'com.brkcvnt.kaloripusulasi'\n        minSdk 26\n        targetSdk 34\n        versionCode 3\n        versionName '1.2.0'\n    }\n}\ndependencies { implementation 'androidx.webkit:webkit:1.12.1' }\n","android/app/src/main/AndroidManifest.xml":"<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\">\n    <uses-permission android:name=\"android.permission.INTERNET\"/>\n    <uses-permission android:name=\"android.permission.REQUEST_INSTALL_PACKAGES\"/>\n    <application android:label=\"Kalori Pusulası\" android:icon=\"@mipmap/ic_launcher\" android:theme=\"@android:style/Theme.Material.Light.NoActionBar\" android:allowBackup=\"false\" android:usesCleartextTraffic=\"false\" android:supportsRtl=\"true\">\n        <activity android:name=\".MainActivity\" android:exported=\"true\" android:configChanges=\"orientation|screenSize|keyboardHidden\" android:windowSoftInputMode=\"adjustResize\">\n            <intent-filter><action android:name=\"android.intent.action.MAIN\"/><category android:name=\"android.intent.category.LAUNCHER\"/></intent-filter>\n        </activity>\n        <provider android:name=\"androidx.core.content.FileProvider\" android:authorities=\"${applicationId}.updates\" android:exported=\"false\" android:grantUriPermissions=\"true\">\n            <meta-data android:name=\"android.support.FILE_PROVIDER_PATHS\" android:resource=\"@xml/update_paths\"/>\n        </provider>\n    </application>\n</manifest>\n","android/app/src/main/java/com/brkcvnt/kaloripusulasi/AppUpdater.java":"package com.brkcvnt.kaloripusulasi;\n\nimport android.app.AlertDialog;\nimport android.app.ProgressDialog;\nimport android.content.Intent;\nimport android.content.Context;\nimport android.content.pm.PackageInfo;\nimport android.content.pm.PackageManager;\nimport android.content.pm.Signature;\nimport android.net.Uri;\nimport android.os.Build;\nimport android.provider.Settings;\nimport android.view.ContextThemeWrapper;\nimport android.widget.Toast;\nimport androidx.core.content.FileProvider;\nimport org.json.JSONObject;\nimport java.io.*;\nimport java.net.*;\nimport java.nio.charset.StandardCharsets;\nimport java.security.MessageDigest;\nimport java.util.*;\nimport java.util.concurrent.*;\nimport java.util.concurrent.atomic.AtomicBoolean;\n\n/** Update transport is separate from the offline diary. Only matching signed APKs can be installed. */\nfinal class AppUpdater {\n    private static final String MANIFEST = \"https://github.com/Brkcvnt/kalori-pusulasi/releases/latest/download/update.json\";\n    private static final String PREFIX = \"/Brkcvnt/kalori-pusulasi/releases/download/\";\n    private static final long MAX_APK = 100L*1024*1024;\n    private final MainActivity activity;\n    private final ExecutorService worker = Executors.newSingleThreadExecutor();\n    private final AtomicBoolean busy = new AtomicBoolean(false);\n    private final AtomicBoolean cancelled = new AtomicBoolean(false);\n    private volatile boolean closed;\n    private ProgressDialog progress;\n    private File pendingApk;\n    private long pendingVersion;\n    private boolean waitingForPermission;\n\n    AppUpdater(MainActivity activity) { this.activity=activity; }\n    private PackageInfo current() throws Exception { return activity.getPackageManager().getPackageInfo(activity.getPackageName(), flags()); }\n    private int flags() { return Build.VERSION.SDK_INT>=28 ? PackageManager.GET_SIGNING_CERTIFICATES : PackageManager.GET_SIGNATURES; }\n    private long code(PackageInfo p) { return Build.VERSION.SDK_INT>=28 ? p.getLongVersionCode() : p.versionCode; }\n    String versionName() { try { return current().versionName; } catch(Exception e) { return \"1.2.0\"; } }\n    private Context dialogContext() { return new ContextThemeWrapper(activity, activity.isDarkMode() ? android.R.style.Theme_Material_Dialog_Alert : android.R.style.Theme_Material_Light_Dialog_Alert); }\n    private void ui(Runnable action) { activity.runOnUiThread(()->{ if(!closed && !activity.isFinishing() && !activity.isDestroyed()) action.run(); }); }\n    private void message(String text) { ui(()->Toast.makeText(activity,text,Toast.LENGTH_LONG).show()); }\n\n    void check(boolean manual) {\n        if(closed || !busy.compareAndSet(false,true)) { if(manual) message(\"Güncelleme kontrolü veya indirme zaten sürüyor.\"); return; }\n        long last=activity.getPreferences(0).getLong(\"last_update_check\",0);\n        if(!manual && System.currentTimeMillis()-last<24L*60*60*1000) { busy.set(false); return; }\n        if(manual) message(\"Güncellemeler kontrol ediliyor…\");\n        worker.execute(()->{\n            try {\n                JSONObject manifest=new JSONObject(new String(readLimited(MANIFEST,65536),StandardCharsets.UTF_8));\n                long version=manifest.getLong(\"versionCode\");\n                String name=manifest.getString(\"versionName\"), url=manifest.getString(\"apkUrl\"), hash=manifest.getString(\"sha256\").toLowerCase(Locale.ROOT);\n                long size=manifest.getLong(\"size\");\n                URL parsed=new URL(url);\n                if(!\"https\".equals(parsed.getProtocol()) || !\"github.com\".equals(parsed.getHost()) || parsed.getUserInfo()!=null || parsed.getPort()!=-1 || parsed.getQuery()!=null || !parsed.getPath().startsWith(PREFIX) || !parsed.getPath().endsWith(\".apk\") || !hash.matches(\"[0-9a-f]{64}\") || size<1 || size>MAX_APK || name.length()>50 || version<1) throw new IOException(\"Geçersiz güncelleme bilgisi.\");\n                activity.getPreferences(0).edit().putLong(\"last_update_check\",System.currentTimeMillis()).apply();\n                if(version<=code(current())) { if(manual) message(\"Uygulaman güncel. Sürüm \"+versionName()); return; }\n                ui(()->new AlertDialog.Builder(dialogContext()).setTitle(\"Güncelleme var\")\n                    .setMessage(\"Kalori Pusulası \"+name+\" hazır. Güncelleme uygulamayı silmeden yüklenir; profil ve günlük kayıtların korunur.\\n\\nİndirmek ister misin?\")\n                    .setPositiveButton(\"İndir ve güncelle\",(d,w)->download(url,hash,size,version))\n                    .setNegativeButton(\"Daha sonra\",null).show());\n            } catch(Exception e) { if(manual) message(\"Güncelleme kontrol edilemedi. İnternet bağlantını kontrol edip tekrar dene.\"); }\n            finally { busy.set(false); }\n        });\n    }\n\n    private HttpURLConnection connect(String address) throws Exception {\n        URL url=new URL(address);\n        for(int redirects=0;redirects<6;redirects++) {\n            String host=url.getHost();\n            if(!\"https\".equals(url.getProtocol()) || !(\"github.com\".equals(host) || host.endsWith(\".githubusercontent.com\")) || url.getUserInfo()!=null || (url.getPort()!=-1 && url.getPort()!=443)) throw new IOException(\"Güvenilmeyen indirme adresi.\");\n            HttpURLConnection connection=(HttpURLConnection)url.openConnection();\n            connection.setConnectTimeout(15000); connection.setReadTimeout(30000); connection.setInstanceFollowRedirects(false);\n            connection.setRequestProperty(\"User-Agent\",\"KaloriPusulasi-Android\");\n            int status=connection.getResponseCode();\n            if(status>=300 && status<400) { String next=connection.getHeaderField(\"Location\"); connection.disconnect(); if(next==null)throw new IOException(); url=new URL(url,next); continue; }\n            if(status!=200) { connection.disconnect(); throw new IOException(\"İndirme yanıtı: \"+status); }\n            return connection;\n        }\n        throw new IOException(\"Çok fazla yönlendirme.\");\n    }\n    private byte[] readLimited(String address,int limit) throws Exception {\n        HttpURLConnection connection=connect(address);\n        try(InputStream in=connection.getInputStream(); ByteArrayOutputStream out=new ByteArrayOutputStream()) {\n            byte[] data=new byte[4096]; int n;\n            while((n=in.read(data))!=-1) { if(out.size()+n>limit)throw new IOException(\"Dosya çok büyük.\"); out.write(data,0,n); }\n            return out.toByteArray();\n        } finally { connection.disconnect(); }\n    }\n    private void download(String address,String expectedHash,long expectedSize,long version) {\n        if(closed || !busy.compareAndSet(false,true)) return;\n        cancelled.set(false);\n        progress=new ProgressDialog(dialogContext()); progress.setTitle(\"Güncelleme indiriliyor\"); progress.setProgressStyle(ProgressDialog.STYLE_HORIZONTAL);\n        progress.setMax(100); progress.setCancelable(false); progress.setButton(ProgressDialog.BUTTON_NEGATIVE,\"Vazgeç\",(d,w)->cancelled.set(true)); progress.show();\n        worker.execute(()->{\n            File file=null; boolean ready=false;\n            try {\n                File directory=new File(activity.getCacheDir(),\"updates\"); if(!directory.exists() && !directory.mkdirs())throw new IOException();\n                file=new File(directory,\"kalori-update.apk\");\n                HttpURLConnection connection=connect(address);\n                MessageDigest digest=MessageDigest.getInstance(\"SHA-256\"); long count=0; int last=-1;\n                try(InputStream in=connection.getInputStream(); OutputStream out=new FileOutputStream(file)) {\n                    byte[] data=new byte[32768]; int n;\n                    while((n=in.read(data))!=-1) {\n                        if(cancelled.get() || closed || Thread.currentThread().isInterrupted())throw new InterruptedIOException();\n                        count+=n; if(count>expectedSize || count>MAX_APK)throw new IOException(\"Dosya boyutu uyuşmuyor.\");\n                        out.write(data,0,n); digest.update(data,0,n);\n                        int percent=(int)(count*100/expectedSize);\n                        if(percent!=last) { last=percent; ui(()->{if(progress!=null)progress.setProgress(percent);}); }\n                    }\n                } finally { connection.disconnect(); }\n                if(count!=expectedSize || !hex(digest.digest()).equals(expectedHash))throw new IOException(\"Dosyanın bütünlüğü doğrulanamadı.\");\n                verify(file,version);\n                pendingApk=file; pendingVersion=version; ready=true;\n                ui(()->{ dismissProgress(); beginInstall(); });\n            } catch(Exception e) {\n                if(!cancelled.get() && !closed) message(e.getMessage()!=null && e.getMessage().contains(\"imza\") ? \"Güncellemenin imzası doğrulanamadı. Kurulum başlatılmadı.\" : \"Güncelleme indirilemedi veya doğrulanamadı. Mevcut kayıtların korunuyor; tekrar deneyebilirsin.\");\n                ui(this::dismissProgress);\n            } finally { if(!ready && file!=null)file.delete(); busy.set(false); }\n        });\n    }\n    private String hex(byte[] bytes) { StringBuilder text=new StringBuilder(); for(byte b:bytes)text.append(String.format(Locale.ROOT,\"%02x\",b&255)); return text.toString(); }\n    private Set<String> certificates(PackageInfo p) throws Exception {\n        Signature[] signatures;\n        if(Build.VERSION.SDK_INT>=28) { if(p.signingInfo==null)throw new IOException(\"imza eksik\"); signatures=p.signingInfo.getApkContentsSigners(); }\n        else signatures=p.signatures;\n        if(signatures==null || signatures.length==0)throw new IOException(\"imza eksik\");\n        Set<String> values=new HashSet<>(); for(Signature signature:signatures)values.add(hex(MessageDigest.getInstance(\"SHA-256\").digest(signature.toByteArray()))); return values;\n    }\n    private void verify(File file,long expectedVersion) throws Exception {\n        PackageInfo installed=current(); PackageInfo update=activity.getPackageManager().getPackageArchiveInfo(file.getAbsolutePath(),flags());\n        if(update==null || !activity.getPackageName().equals(update.packageName) || code(update)!=expectedVersion || code(update)<=code(installed))throw new IOException(\"Güncelleme paketi uyuşmuyor.\");\n        if(!certificates(installed).equals(certificates(update)))throw new IOException(\"imza uyuşmuyor\");\n    }\n    private void dismissProgress() { if(progress!=null) { progress.dismiss(); progress=null; } }\n    private void beginInstall() {\n        try {\n            if(pendingApk==null || !pendingApk.isFile())return;\n            verify(pendingApk,pendingVersion);\n            if(!activity.getPackageManager().canRequestPackageInstalls()) {\n                new AlertDialog.Builder(dialogContext()).setTitle(\"Kurulum izni\")\n                    .setMessage(\"Android, güncellemeyi yüklemek için bu uygulamaya kurulum izni vermeni isteyecek. İzin verdikten sonra uygulamaya dönerek devam edebilirsin.\")\n                    .setPositiveButton(\"Android ayarlarını aç\",(d,w)->{ waitingForPermission=true; activity.startActivity(new Intent(Settings.ACTION_MANAGE_UNKNOWN_APP_SOURCES,Uri.parse(\"package:\"+activity.getPackageName()))); })\n                    .setNegativeButton(\"Daha sonra\",null).show(); return;\n            }\n            Uri apk=FileProvider.getUriForFile(activity,activity.getPackageName()+\".updates\",pendingApk);\n            Intent install=new Intent(Intent.ACTION_VIEW).setDataAndType(apk,\"application/vnd.android.package-archive\")\n                .addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION);\n            activity.startActivity(install);\n        } catch(Exception e) { message(\"Android kurulum ekranı açılamadı. Güncelleme düğmesinden tekrar deneyebilirsin.\"); }\n    }\n    void resumeInstall() {\n        if(waitingForPermission) {\n            waitingForPermission=false;\n            if(activity.getPackageManager().canRequestPackageInstalls())beginInstall();\n        }\n    }\n    void close() { closed=true; cancelled.set(true); worker.shutdownNow(); if(progress!=null) { progress.dismiss(); progress=null; } }\n}\n","android/app/src/main/java/com/brkcvnt/kaloripusulasi/MainActivity.java":"package com.brkcvnt.kaloripusulasi;\n\nimport android.app.Activity;\nimport android.app.AlertDialog;\nimport android.content.Intent;\nimport android.graphics.Color;\nimport android.net.Uri;\nimport android.os.Bundle;\nimport android.webkit.*;\nimport android.widget.Toast;\nimport androidx.webkit.WebViewAssetLoader;\nimport java.io.OutputStream;\nimport java.nio.charset.StandardCharsets;\n\n/** Loads only bundled application assets; no Internet or storage permission. */\npublic class MainActivity extends Activity {\n    private WebView web;\n    private ValueCallback<Uri[]> chooser;\n    private String pendingBackup;\n    private boolean darkMode;\n    private AppUpdater updater;\n    private static final int IMPORT = 21, EXPORT = 22;\n    private static final String HOST = \"appassets.androidplatform.net\";\n\n    @Override public void onCreate(Bundle saved) {\n        super.onCreate(saved);\n        updater = new AppUpdater(this);\n        getWindow().setStatusBarColor(Color.rgb(22,61,53));\n        getWindow().setNavigationBarColor(Color.rgb(22,61,53));\n        web = new WebView(this);\n        web.setBackgroundColor(Color.rgb(246,247,243));\n        setContentView(web);\n        WebSettings settings = web.getSettings();\n        settings.setJavaScriptEnabled(true);\n        settings.setDomStorageEnabled(true);\n        settings.setAllowFileAccess(false);\n        settings.setAllowContentAccess(true); // Read only documents selected through Android's picker.\n        settings.setMixedContentMode(WebSettings.MIXED_CONTENT_NEVER_ALLOW);\n        web.addJavascriptInterface(new BackupBridge(), \"AndroidBackup\");\n        WebViewAssetLoader loader = new WebViewAssetLoader.Builder()\n            .addPathHandler(\"/assets/\", new WebViewAssetLoader.AssetsPathHandler(this)).build();\n        web.setWebViewClient(new WebViewClient() {\n            @Override public void onPageFinished(WebView view, String url) {\n                if(!url.startsWith(\"https://\"+HOST+\"/assets/\"))return;\n                view.evaluateJavascript(\"(()=>{if(document.getElementById('native-updates'))return;const f=document.querySelector('footer');if(!f)return;f.style.flexWrap='wrap';const d=document.createElement('div');d.id='native-updates';d.style.cssText='width:100%;display:flex;align-items:center;flex-wrap:wrap;gap:12px;margin-top:12px';const s=document.createElement('span');s.textContent='Sürüm '+AndroidBackup.getVersion();const b=document.createElement('button');b.type='button';b.className='ghost';b.style.minHeight='44px';b.textContent='Güncellemeleri kontrol et';b.onclick=()=>AndroidBackup.checkForUpdates();d.append(s,b);f.append(d);})()\",null);\n            }\n            @Override public WebResourceResponse shouldInterceptRequest(WebView view, WebResourceRequest req) {\n                WebResourceResponse result = loader.shouldInterceptRequest(req.getUrl());\n                if (result != null) return result;\n                return new WebResourceResponse(\"text/plain\", \"UTF-8\", 403, \"Blocked\", null, new java.io.ByteArrayInputStream(new byte[0]));\n            }\n            @Override public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest req) {\n                Uri uri=req.getUrl();\n                if (\"https\".equals(uri.getScheme()) && HOST.equals(uri.getHost()) && uri.getPath().startsWith(\"/assets/\")) return false;\n                if (req.isForMainFrame() && (\"https\".equals(uri.getScheme()) || \"http\".equals(uri.getScheme()))) {\n                    try { startActivity(new Intent(Intent.ACTION_VIEW, uri)); } catch(Exception e) { message(\"Bağlantıyı açacak tarayıcı bulunamadı.\"); }\n                }\n                return true;\n            }\n        });\n        web.setWebChromeClient(new WebChromeClient() {\n            @Override public boolean onShowFileChooser(WebView view, ValueCallback<Uri[]> callback, FileChooserParams params) {\n                if (chooser!=null) chooser.onReceiveValue(null);\n                chooser=callback;\n                Intent pick=new Intent(Intent.ACTION_OPEN_DOCUMENT).addCategory(Intent.CATEGORY_OPENABLE).setType(\"application/json\");\n                try { startActivityForResult(pick,IMPORT); } catch(Exception e) { chooser.onReceiveValue(null); chooser=null; message(\"Dosya seçici açılamadı.\"); }\n                return true;\n            }\n            @Override public boolean onJsConfirm(WebView view, String url, String text, JsResult result) {\n                android.view.ContextThemeWrapper dialogTheme = new android.view.ContextThemeWrapper(MainActivity.this,\n                    darkMode ? android.R.style.Theme_Material_Dialog_Alert : android.R.style.Theme_Material_Light_Dialog_Alert);\n                new AlertDialog.Builder(dialogTheme).setTitle(\"Kalori Pusulası\").setMessage(text)\n                    .setPositiveButton(\"Devam et\",(d,w)->result.confirm()).setNegativeButton(\"Vazgeç\",(d,w)->result.cancel())\n                    .setOnCancelListener(d->result.cancel()).show();\n                return true;\n            }\n        });\n        web.loadUrl(\"https://\"+HOST+\"/assets/index.html\");\n        web.postDelayed(()->updater.check(false), 2000);\n    }\n\n    private void message(String text) { Toast.makeText(this,text,Toast.LENGTH_LONG).show(); }\n    public class BackupBridge {\n        @JavascriptInterface public void checkForUpdates() { runOnUiThread(()->updater.check(true)); }\n        @JavascriptInterface public String getVersion() { return updater.versionName(); }\n        @JavascriptInterface public boolean isSystemDark() {\n            return (getResources().getConfiguration().uiMode & android.content.res.Configuration.UI_MODE_NIGHT_MASK)\n                == android.content.res.Configuration.UI_MODE_NIGHT_YES;\n        }\n        @JavascriptInterface public void setDarkMode(boolean dark) {\n            runOnUiThread(()->{\n                darkMode=dark;\n                int color=dark ? Color.rgb(16,27,24) : Color.rgb(246,247,243);\n                getWindow().setStatusBarColor(color);\n                getWindow().setNavigationBarColor(color);\n                getWindow().getDecorView().setSystemUiVisibility(dark ? 0 :\n                    android.view.View.SYSTEM_UI_FLAG_LIGHT_STATUS_BAR | android.view.View.SYSTEM_UI_FLAG_LIGHT_NAVIGATION_BAR);\n                web.setBackgroundColor(color);\n            });\n        }\n        @JavascriptInterface public void exportJson(String json) {\n            if (json==null || json.length()>5_000_000) return;\n            runOnUiThread(()->{\n                pendingBackup=json;\n                Intent save=new Intent(Intent.ACTION_CREATE_DOCUMENT).addCategory(Intent.CATEGORY_OPENABLE)\n                    .setType(\"application/json\").putExtra(Intent.EXTRA_TITLE,\"kalori-pusulasi-yedek.json\");\n                try { startActivityForResult(save,EXPORT); } catch(Exception e) { pendingBackup=null; message(\"Yedek kaydedilemedi.\"); }\n            });\n        }\n    }\n    @Override protected void onActivityResult(int request,int result,Intent data) {\n        super.onActivityResult(request,result,data);\n        if(request==IMPORT && chooser!=null) {\n            chooser.onReceiveValue(result==RESULT_OK && data!=null && data.getData()!=null ? new Uri[]{data.getData()} : null);\n            chooser=null;\n        }\n        if(request==EXPORT) {\n            String json=pendingBackup; pendingBackup=null;\n            if(result==RESULT_OK && data!=null && data.getData()!=null && json!=null) {\n                try(OutputStream out=getContentResolver().openOutputStream(data.getData())) {\n                    if(out==null) throw new java.io.IOException();\n                    out.write(json.getBytes(StandardCharsets.UTF_8));\n                    message(\"Yedek kaydedildi.\");\n                } catch(Exception e) { message(\"Yedek kaydedilemedi.\"); }\n            }\n        }\n    }\n    @Override public void onBackPressed() { if(web.canGoBack()) web.goBack(); else super.onBackPressed(); }\n    boolean isDarkMode() { return darkMode; }\n    @Override protected void onResume() { super.onResume(); if(updater!=null) updater.resumeInstall(); }\n    @Override protected void onDestroy() { if(updater!=null) updater.close(); if(chooser!=null) chooser.onReceiveValue(null); web.removeJavascriptInterface(\"AndroidBackup\"); web.destroy(); super.onDestroy(); }\n}\n","android/app/src/main/res/xml/update_paths.xml":"<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<paths xmlns:android=\"http://schemas.android.com/apk/res/android\"><cache-path name=\"updates\" path=\"updates/\"/></paths>\n","android/build.gradle":"plugins { id 'com.android.application' version '8.7.3' apply false }\n","android/gradle.properties":"android.useAndroidX=true\norg.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8\n","android/README.md":"# Kalori Pusulası Android\n\nAndroid 8.0+ için çevrimdışı kalori takibi ve uygulama içi güncelleme. Web dosyaları APK içine gömülür. İnternet yalnızca sürüm kontrolü ve APK indirmek için kullanılır. Günlük kayıtları sunucuya gönderilmez. Android'in kurulum izni güncelleme sırasında istenir. Kamera, konum veya genel depolama izni istenmez. APK verileri tarayıcı verilerinden ayrıdır.\n\nGitHub Actions, Gradle 8.9 / JDK 17 / AGP 8.7.3 ile imzasız release APK üretir. Son yayın paketi yerelde kalıcı anahtarla imzalanır ve doğrulanır. İmza anahtarı sonraki güncellemelerde tekrar kullanılır. Paket adı, yeni sürüm kodu, SHA-256 ve kurulu uygulamanın sertifikası doğrulanmadan güncelleme kurulmaz. Android kurulum onayı kullanıcıya aittir. Ayrıntılar SIGNING.md dosyasındadır.\n\nGerçek cihaz kurulumu bu geliştirme ortamında test edilememiştir. Web arayüzü tarayıcıda test edilmiştir.\n\nYayın: https://github.com/Brkcvnt/kalori-pusulasi/releases/tag/android-v1.2.0\n\n1.1.0: Açık / Koyu / Cihaz seçenekleri, kalıcı tema tercihi ve Android sistem çubuklarıyla uyum. 1.0.0 sürümündeki verileri yeni kurulumdan önce JSON olarak yedekle.\n","android/settings.gradle":"pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }\ndependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }\nrootProject.name = 'KaloriPusulasi'\ninclude ':app'\n","android/SIGNING.md":"# Kalıcı Android imzası ve güncellemeler\n\n1.2.0 ve sonrası yayın APK'ları `kalori-release` takma adlı kalıcı RSA anahtarıyla bu bilgisayarda imzalanır. GitHub Actions yalnızca imzasız release APK üretir; anahtar GitHub'a gönderilmez.\n\nÖzel anahtar, proje kaynaklarından ayrı yerel bir dizinde saklanır. Bu dizindeki `.gitignore` bütün dosyaları Git dışında tutar. `kalori-release.p12` özel anahtarı, `password.dpapi` ise Windows hesabıyla şifrelenmiş parolayı içerir. İkisini de koruyun; Windows hesabı veya bilgisayar değişiminden önce güvenli taşınabilir anahtar yedeği hazırlayın. Bu dosyaları kaynak koduna veya sürüm indirmelerine eklemeyin.\n\nYeni sürümde aynı applicationId ve aynı imza anahtarı kullanılır; versionCode artırılır. APK yerelde imzalanıp doğrulanır. `update.json`, imzalı APK'nın URL, boyut ve SHA-256 değerini içerir. Uygulama dosyayı kendi içinde indirir; paket adı, sürüm, dosya özeti ve imza eşleşmeden kurulum açılmaz. Android'in kurulum izni ve kullanıcı onayı gerekir. Otomatik kontrol uygulama açıkken günde en fazla bir kere çalışır; manuel kontrol düğmesi her zaman kullanılabilir.\n\nEski 1.0.0 / 1.1.0 debug sürümlerinin anahtarları korunmadığından bu kalıcı imzaya tek seferlik geçişte yeniden kurulum ve kayıt aktarımı gerekebilir. Kalıcı imzalı sürümler arasında uygulamayı kaldırmak gerekmez.\n"}''')
          for filename, content in files.items():
              p=pathlib.Path(filename); p.parent.mkdir(parents=True,exist_ok=True); p.write_text(content,encoding="utf-8")
          assets=pathlib.Path("android/app/src/main/assets"); assets.mkdir(parents=True,exist_ok=True)
          for name in ["index.html","style.css","theme.js","app.js","core.js","icon.svg","icon-192.png","icon-512.png","manifest.webmanifest"]:
              shutil.copyfile(name,assets / name)
          app=(assets / "app.js").read_text(encoding="utf-8")
          old="$('#export').onclick=()=>{"
          assert app.count(old)==1
          app=app.replace(old,"$('#export').onclick=()=>{if(window.AndroidBackup){window.AndroidBackup.exportJson(JSON.stringify(state,null,2));return;}")
          app=app.replace("if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});", "// Android uses bundled assets.")
          (assets / "app.js").write_text(app,encoding="utf-8")
          icons=pathlib.Path("android/app/src/main/res/mipmap-xxxhdpi"); icons.mkdir(parents=True,exist_ok=True)
          shutil.copyfile("icon-512.png",icons / "ic_launcher.png")
          PY
      - name: Build unsigned production package
        run: gradle -p android assembleRelease --no-daemon
      - name: Package for local signing
        shell: bash
        run: |
          mkdir -p apk-output
          BT=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$BT/zipalign" -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk apk-output/app-release-unsigned.apk
          cp "$BT/lib/apksigner.jar" apk-output/apksigner.jar
          "$BT/aapt" dump badging apk-output/app-release-unsigned.apk > apk-output/APK-INFO.txt
          cat apk-output/APK-INFO.txt
          zip -r apk-output/Android-Kaynak-Kodu.zip android -x 'android/.gradle/*' 'android/app/build/*' 'android/build/*'
      - uses: actions/upload-artifact@v4
        with:
          name: Kalori-Pusulasi-Unsigned
          path: apk-output/
