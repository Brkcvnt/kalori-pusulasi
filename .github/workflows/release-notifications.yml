name: Android release notification
on:
  release:
    types: [published]
permissions: {}
jobs:
  notify:
    if: ${{ startsWith(github.event.release.tag_name, 'android-v') && !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Authenticate release workflow
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: projects/285154511801/locations/global/workloadIdentityPools/kalori-github/providers/github-release
          service_account: github-release-push@kalori-pusulasi.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/firebase.messaging
          access_token_lifetime: 300s
          create_credentials_file: false
          export_environment_variables: false
      - name: Send verified Android release
        env:
          FCM_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          node --input-type=module <<'JS'
          import {readFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          const repo = 'Brkcvnt/kalori-pusulasi';
          const {release, repository} = JSON.parse(readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8'));
          const tag = release.tag_name;
          if (repository.id !== 1437816407 || !/^android-v[0-9]{1,5}\.[0-9]{1,5}\.[0-9]{1,5}$/.test(tag)) {
            throw Error('Unexpected release');
          }
          const versionName = tag.slice('android-v'.length);
          const asset = release.assets.find(item => item.name === 'Kalori-Pusulasi-' + versionName + '.apk');
          if (!asset) throw Error('Published APK missing');
          const prefix = 'https://github.com/' + repo + '/releases/download/' + tag + '/';
          const manifest = await fetch(prefix + 'update.json', {signal: AbortSignal.timeout(20000)});
          if (!manifest.ok) throw Error('Update manifest unavailable');
          const update = await manifest.json();
          if (update.versionName !== versionName || !Number.isSafeInteger(update.versionCode) ||
              update.versionCode < 1 || update.apkUrl !== prefix + asset.name ||
              !/^[a-f0-9]{64}$/.test(update.sha256) || update.size !== asset.size ||
              update.size < 1 || update.size > 100 * 1024 * 1024) {
            throw Error('Published APK and manifest differ');
          }
          if (asset.digest && asset.digest !== 'sha256:' + update.sha256) throw Error('APK digest mismatch');
          if (!asset.digest) {
            const apk = await fetch(update.apkUrl, {signal: AbortSignal.timeout(30000)});
            if (!apk.ok) throw Error('Published APK unavailable');
            const bytes = Buffer.from(await apk.arrayBuffer());
            if (bytes.length !== update.size || createHash('sha256').update(bytes).digest('hex') !== update.sha256) {
              throw Error('APK digest mismatch');
            }
          }
          const latest = await fetch('https://github.com/' + repo + '/releases/latest/download/update.json',
            {signal: AbortSignal.timeout(20000)});
          if (!latest.ok || (await latest.json()).sha256 !== update.sha256) {
            throw Error('The Android release is not current');
          }
          const response = await fetch('https://fcm.googleapis.com/v1/projects/kalori-pusulasi/messages:send', {
            method: 'POST',
            headers: {'Authorization': 'Bearer ' + process.env.FCM_TOKEN, 'Content-Type': 'application/json'},
            signal: AbortSignal.timeout(20000),
            body: JSON.stringify({message: {
              topic: 'kalori-android-releases',
              data: {kind: 'release', versionName, versionCode: String(update.versionCode)},
              android: {priority: 'high', ttl: '604800s', collapse_key: 'kalori-release'}
            }})
          });
          const result = await response.json();
          if (!response.ok || !result.name) throw Error('FCM: ' + (result.error?.status ?? response.status));
          console.log('FCM accepted release ' + versionName + ': ' + result.name);
          JS

